# Standalone review template, not installed or deployment-ready.
# Replace the two __REVIEWED_*__ inputs only in a reviewed rendered copy.
# The bind address must be an assigned private IPv4 address, never a wildcard.
# Required existing identities, runtime directories and TLS files are documented
# in CONTROLLER_ISOLATION.md; this template creates none of them.
user agent-controller-proxy;
worker_processes 1;
pid /run/agent-controller-proxy/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 128;
}

http {
    # $request_uri is the ORIGINAL URI including arguments. Do not use $uri:
    # Nginx normalizes that variable before location matching.
    # Regex entries are case-sensitive; ordinary map strings are not.
    map "$request_method:$request_uri" $controller_worker_route {
        default 0;
        ~^GET:/snapshot$ 1;
        ~^GET:/trace$ 1;
        ~^POST:/authorize$ 1;
        ~^POST:/execute$ 1;
        ~^POST:/act$ 1;
        ~^POST:/model$ 1;
        ~^POST:/delegate$ 1;
        ~^POST:/complete$ 1;
    }

    access_log off;
    server_tokens off;
    client_max_body_size 32768;
    client_body_buffer_size 32768;
    client_body_temp_path /run/agent-controller-proxy/client-body;
    proxy_temp_path /run/agent-controller-proxy/proxy;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 10s;

    server {
        listen __REVIEWED_CONTROLLER_PRIVATE_IPV4__:8443 ssl;
        server_name __REVIEWED_CONTROLLER_PRIVATE_DNS__;

        ssl_certificate /run/agent-controller-tls/server.crt;
        ssl_certificate_key /run/agent-controller-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        # The only server-level rewrites are terminal rejections.
        if ($host != "__REVIEWED_CONTROLLER_PRIVATE_DNS__") {
            return 404;
        }
        if ($controller_worker_route = 0) {
            return 404;
        }
        # Preserve the controller's bounded Content-Length request contract.
        if ($http_transfer_encoding != "") {
            return 400;
        }

        location / {
            # No URI suffix/rewrite, variable destination, or admin upstream.
            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Connection "";
            # Preserve bearer fields; the controller still validates their
            # cardinality, identity and current job/run authority on every call.
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_redirect off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
